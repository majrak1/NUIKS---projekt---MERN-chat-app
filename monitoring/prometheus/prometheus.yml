global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth:3001"]
    metrics_path: /metrics

  - job_name: "messaging-service"
    static_configs:
      - targets: ["messaging:3002"]
    metrics_path: /metrics

  - job_name: "file-service"
    static_configs:
      - targets: ["file:3003"]
    metrics_path: /metrics

  - job_name: "chatbot-service"
    static_configs:
      - targets: ["chatbot:3004"]
    metrics_path: /metrics
