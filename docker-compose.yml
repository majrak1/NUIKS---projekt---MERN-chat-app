services:
  # --- Databases ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatapp_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Microservices ---
  auth:
    build: ./services/auth
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chatapp_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  messaging:
    build: ./services/messaging
    environment:
      PORT: 3002
      MONGO_DB_URI: mongodb://mongodb:27017/chatapp_messages
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  file:
    build: ./services/file
    environment:
      PORT: 3003
      MONGO_DB_URI: mongodb://mongodb:27017/chatapp_files
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  chatbot:
    build: ./services/chatbot
    environment:
      PORT: 3004
      MONGO_DB_URI: mongodb://mongodb:27017/chatapp_messages
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      AI_PROVIDER: ${AI_PROVIDER:-groq}                                                                                                                               
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}                                                                                                                     
      GROQ_API_KEY: ${GROQ_API_KEY}  
      HF_TOKEN: ${HF_TOKEN}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - auth
      - messaging
      - file
      - chatbot
    restart: unless-stopped

  # --- API Gateway ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - messaging
      - file
      - chatbot
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
