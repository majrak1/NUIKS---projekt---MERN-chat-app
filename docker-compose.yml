services:
  # --- Databases ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatapp_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Microservices ---
  auth:
    build: ./services/auth
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: chatapp_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  messaging:
    build: ./services/messaging
    environment:
      PORT: 3002
      MONGO_DB_URI: mongodb://mongodb:27017/chatapp_messages
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  file:
    build: ./services/file
    environment:
      PORT: 3003
      MONGO_DB_URI: mongodb://mongodb:27017/chatapp_files
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      NODE_ENV: ${NODE_ENV:-development}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://212.235.185.13:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-user-14}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-thestrongestvajePass14}
      S3_BUCKET: ${S3_BUCKET:-user-14}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  chatbot:
    build: ./services/chatbot
    environment:
      PORT: 3004
      MONGO_DB_URI: mongodb://mongodb:27017/chatapp_messages
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      AI_PROVIDER: ${AI_PROVIDER:-groq}                                                                                                                               
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}                                                                                                                     
      GROQ_API_KEY: ${GROQ_API_KEY}  
      HF_TOKEN: ${HF_TOKEN}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - auth
      - messaging
      - file
      - chatbot
    restart: unless-stopped

  # --- Monitoring Stack ---
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - auth
      - messaging
      - file
      - chatbot
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # --- API Gateway ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - messaging
      - file
      - chatbot
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  grafana_data:
